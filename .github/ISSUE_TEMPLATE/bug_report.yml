name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python -m orchestrator gta6_news_drop
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.11"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
