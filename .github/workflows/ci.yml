name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=orchestrator

  review:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports and router
        run: |
          python -c "
          from orchestrator.router import build_default_router
          from orchestrator.agents import AGENT_REGISTRY
          router = build_default_router()
          print('Imports OK')
          print('Registered agents:', list(AGENT_REGISTRY.keys()))
          print('Loaded workflows:', list(router.workflows.keys()))
          "

      - name: Validate all workflows parse
        run: |
          python -c "
          from orchestrator.router import load_all_workflows
          workflows = load_all_workflows()
          for name, wf in workflows.items():
              assert len(wf.steps) >= 1, f'{name} has no steps'
              print(f'  {name}: {len(wf.steps)} steps — OK')
          print(f'All {len(workflows)} workflows valid')
          "

      - name: Validate game configs load
        run: |
          python -c "
          from orchestrator.settings import load_game_config
          from pathlib import Path
          configs = Path('config/games').glob('*.yaml')
          for cfg in sorted(configs):
              game = load_game_config(cfg.stem)
              assert game.slug, f'{cfg.stem} missing slug'
              print(f'  {game.slug} ({game.name}) — OK')
          "

      - name: Dry-run orchestrator CLI
        run: |
          python -m orchestrator --list
          python -m orchestrator gta6_news_drop \
            --var hook="CI review pass" \
            --var summary="Official trailer discussed" \
            --var news_type="trailer" \
            --var source="https://www.rockstargames.com/newswire" \
            --var cta="Join Discord"
          python -m orchestrator product_launch \
            --var hook="New script drop" \
            --var summary="Custom job system v1 launched" \
            --var cta="Buy now"
          python -m orchestrator rp_server_launch \
            --var server_name="Test Server" \
            --var launch_date="TBD"
          python -m orchestrator npc_pack_release \
            --var pack_name="Bartender Pack v1" \
            --var summary="AI bartender NPC for RP servers"
          python -m orchestrator community_onboarding \
            --var server_name="Test Server"
          python -m orchestrator weekly_report \
            --var week="1"

